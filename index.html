<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Northbound Expeditions</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#14201E;
  --cream:#F1EAD9;
  --muted:rgba(241,234,217,.68);
  --gold:#C9973E;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:var(--ink);
}

body{
  font-family:'Work Sans',sans-serif;
  overflow:hidden;
}


/* =========================
   HERO
========================= */

.hero{
  position:relative;
  width:100%;
  height:100vh;
  height:100dvh;
  min-height:560px;

  overflow:hidden;

  background:var(--ink);
  color:var(--cream);
}


/* =========================
   BACKGROUND
========================= */

.hero-bg{
  position:absolute;
  inset:-5%;

  z-index:1;

  background-size:cover;
  background-position:center bottom;
  background-repeat:no-repeat;

  opacity:0;

  transform:scale(1.1) translateY(-3%);

  transition:
    opacity 1.15s ease,
    transform 5s cubic-bezier(.22,.61,.36,1);
}

.hero-bg.active{
  opacity:1;
  transform:scale(1) translateY(2%);
}


/* =========================
   OVERLAY
========================= */

.hero-overlay{
  position:absolute;
  inset:0;

  z-index:2;

  background:
    linear-gradient(
      100deg,
      rgba(20,32,30,.95) 0%,
      rgba(20,32,30,.76) 30%,
      rgba(20,32,30,.32) 60%,
      rgba(20,32,30,.04) 85%
    );
}


/* =========================
   CONTENT
========================= */

.hero-content{
  position:absolute;

  left:6%;
  top:50%;

  transform:translateY(-50%);

  width:min(520px,43vw);

  z-index:5;
}

.kicker{
  display:flex;
  align-items:center;
  gap:12px;

  margin-bottom:22px;

  font-size:10px;
  letter-spacing:.22em;
  text-transform:uppercase;

  color:var(--gold);
}

.kicker::before{
  content:"";

  width:34px;
  height:1px;

  background:var(--gold);
}

.hero-heading{
  margin:0 0 18px;

  font-family:'Fraunces',serif;
  font-style:italic;
  font-weight:500;

  font-size:clamp(2rem,4.5vw,4.4rem);

  line-height:1.04;

  letter-spacing:-.025em;

  transition:
    opacity .45s ease,
    transform .55s ease;
}

.hero-sub{
  max-width:500px;

  margin:0 0 26px;

  font-size:clamp(.82rem,1.3vw,1rem);

  line-height:1.75;

  color:var(--muted);

  transition:
    opacity .45s ease,
    transform .55s ease;
}

.location{
  display:flex;
  align-items:center;
  gap:8px;

  font-size:10px;
  letter-spacing:.15em;
  text-transform:uppercase;

  color:rgba(241,234,217,.5);
}

.location-dot{
  width:5px;
  height:5px;

  border-radius:50%;

  background:var(--gold);
}


/* =========================
   CONTENT ANIMATION
========================= */

.content-changing .hero-heading,
.content-changing .hero-sub,
.content-changing .location{
  opacity:0;
  transform:translateY(14px);
}


/* =========================
   HORIZONTAL SLIDER
========================= */

.gallery{
  position:absolute;

  left:50%;
  bottom:8%;

  transform:translateX(-50%);

  z-index:6;

  width:88%;
  height:230px;

  display:flex;
  align-items:flex-end;

  gap:18px;

  overflow-x:auto;
  overflow-y:hidden;

  padding:20px 0;

  scrollbar-width:none;

  cursor:grab;

  /* IMPORTANT:
     No background color
  */

  background:transparent;
}

.gallery::-webkit-scrollbar{
  display:none;
}

.gallery.dragging{
  cursor:grabbing;
}


/* =========================
   CARD
========================= */

.gallery-item{
  position:relative;

  flex:0 0 150px;

  width:150px;
  height:190px;

  overflow:hidden;

  border-radius:24px;

  background:transparent;

  border:1px solid rgba(241,234,217,.18);

  opacity:.52;

  transform:scale(.88);

  transition:
    transform .7s cubic-bezier(.22,.61,.36,1),
    opacity .5s ease,
    border-color .5s ease,
    box-shadow .5s ease;

  cursor:pointer;
}

.gallery-item:hover{
  opacity:.82;
  transform:scale(.93);
}

.gallery-item.active{
  opacity:1;

  transform:scale(1);

  border-color:rgba(201,151,62,.85);

  box-shadow:
    0 25px 60px rgba(0,0,0,.42);
}


/* =========================
   CARD IMAGE
========================= */

.gallery-item img{
  display:block;

  width:100%;
  height:100%;

  object-fit:cover;

  transition:
    transform .9s cubic-bezier(.22,.61,.36,1);
}

.gallery-item:hover img{
  transform:scale(1.06);
}


/* =========================
   IMAGE GRADIENT
========================= */

.gallery-item::after{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      to top,
      rgba(20,32,30,.7),
      transparent 55%
    );

  pointer-events:none;
}


/* =========================
   NUMBER
========================= */

.number{
  position:absolute;

  left:16px;
  bottom:14px;

  z-index:2;

  font-size:9px;
  letter-spacing:.2em;

  color:rgba(241,234,217,.72);
}

.gallery-item.active .number{
  color:var(--gold);
}


/* =========================
   PROGRESS
========================= */

.progress{
  position:absolute;

  left:6%;
  bottom:7%;

  z-index:7;

  width:120px;
  height:2px;

  background:rgba(241,234,217,.18);

  overflow:hidden;
}

.progress-bar{
  width:0;
  height:100%;

  background:var(--gold);
}


/* =========================
   SCROLL HINT
========================= */

.scroll-hint{
  position:absolute;

  right:6%;
  bottom:7%;

  z-index:7;

  display:flex;
  align-items:center;
  gap:10px;

  font-size:9px;
  letter-spacing:.17em;
  text-transform:uppercase;

  color:rgba(241,234,217,.42);
}

.scroll-hint::before{
  content:"← →";

  color:var(--gold);

  font-size:13px;
}


/* =========================
   TABLET
========================= */

@media(max-width:900px){

  .hero-content{
    left:5%;
    width:45vw;
  }

  .gallery{
    width:90%;
  }

  .gallery-item{
    flex-basis:135px;
    width:135px;
    height:175px;
  }
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .hero-overlay{
    background:
      linear-gradient(
        100deg,
        rgba(20,32,30,.95) 0%,
        rgba(20,32,30,.68) 55%,
        rgba(20,32,30,.15) 100%
      );
  }

  .hero-content{
    left:6%;

    top:42%;

    width:46vw;
  }

  .hero-heading{
    font-size:clamp(1.6rem,6vw,2.5rem);
  }

  .hero-sub{
    font-size:.72rem;
    line-height:1.55;
  }

  .kicker{
    font-size:8px;
    margin-bottom:15px;
  }

  .gallery{
    left:5%;
    bottom:7%;

    transform:none;

    width:90%;

    height:185px;

    gap:12px;

    padding:10px 0;
  }

  .gallery-item{
    flex-basis:105px;

    width:105px;
    height:150px;

    border-radius:19px;
  }

  .progress{
    display:none;
  }

  .scroll-hint{
    display:none;
  }
}


/* =========================
   SMALL MOBILE
========================= */

@media(max-width:480px){

  .hero-content{
    top:40%;
    width:44vw;
  }

  .hero-heading{
    font-size:1.5rem;
  }

  .hero-sub{
    font-size:.68rem;
  }

  .gallery-item{
    flex-basis:95px;
    width:95px;
    height:140px;
  }
}


/* =========================
   REDUCED MOTION
========================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    transition:none!important;
    animation:none!important;
  }
}
</style>
</head>


<body>

<section class="hero">

  <div class="hero-bg active" id="bgA"></div>
  <div class="hero-bg" id="bgB"></div>

  <div class="hero-overlay"></div>


  <!-- HERO CONTENT -->

  <div class="hero-content" id="heroContent">

    <div class="kicker">
      Northbound Expeditions
    </div>

    <h1 class="hero-heading" id="heroHeading">
      Where the ice remembers
    </h1>

    <p class="hero-sub" id="heroSub">
      Svalbard, Norway — polar bear country at eighty degrees north, where the summer sun never sets.
    </p>

    <div class="location">
      <span class="location-dot"></span>
      <span id="heroLocation">
        Svalbard, Norway
      </span>
    </div>

  </div>


  <!-- HORIZONTAL IMAGE SLIDER -->

  <div class="gallery" id="gallery"></div>


  <!-- PROGRESS -->

  <div class="progress">
    <div
      class="progress-bar"
      id="progressBar">
    </div>
  </div>


  <!-- HINT -->

  <div class="scroll-hint">
    Drag to explore
  </div>

</section>


<script>

/* =========================================
   SLIDE DATA
========================================= */

const slides = [

  {
    img:"https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=1600&q=85",
    heading:"Where the ice remembers",
    sub:"Svalbard, Norway — polar bear country at eighty degrees north, where the summer sun never sets.",
    location:"Svalbard, Norway"
  },

  {
    img:"https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1600&q=85",
    heading:"Cliffs that outlast the wind",
    sub:"The Faroe Islands — turf-roofed villages tucked beneath sea cliffs older than memory.",
    location:"Faroe Islands"
  },

  {
    img:"https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1600&q=85",
    heading:"Granite against the sky",
    sub:"Torres del Paine, Patagonia — glacial towers standing over turquoise water.",
    location:"Patagonia, Chile"
  },

  {
    img:"https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1600&q=85",
    heading:"A quiet the size of a valley",
    sub:"Fiordland, New Zealand — rainforest and mist folded into ancient fjords.",
    location:"Fiordland, New Zealand"
  },

  {
    img:"https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1600&q=85",
    heading:"Fire under permanent frost",
    sub:"Kamchatka, Russia — volcanoes and hot springs at the edge of the Pacific.",
    location:"Kamchatka, Russia"
  },

  {
    img:"https://images.unsplash.com/photo-1454496522488-7a8e488e8606?auto=format&fit=crop&w=1600&q=85",
    heading:"A desert carved from cold",
    sub:"Ladakh, India — high mountain passes and monasteries above the clouds.",
    location:"Ladakh, India"
  }

];


/* =========================================
   ELEMENTS
========================================= */

const gallery =
  document.getElementById("gallery");

const heading =
  document.getElementById("heroHeading");

const sub =
  document.getElementById("heroSub");

const location =
  document.getElementById("heroLocation");

const content =
  document.getElementById("heroContent");

const progressBar =
  document.getElementById("progressBar");

const backgrounds = [

  document.getElementById("bgA"),

  document.getElementById("bgB")

];


/* =========================================
   STATE
========================================= */

let current = 0;

let activeBackground = 0;

let autoplay;

let progressAnimation;

const AUTO_TIME = 5000;


/* =========================================
   CREATE SLIDER
========================================= */

function createSlider(){

  slides.forEach((slide,index)=>{

    const card =
      document.createElement("div");

    card.className =
      "gallery-item";

    card.dataset.index =
      index;

    if(index === 0){

      card.classList.add("active");

    }

    card.innerHTML = `

      <img
        src="${slide.img}"
        alt="${slide.heading}"
        draggable="false"
      >

      <span class="number">
        ${String(index + 1).padStart(2,"0")}
      </span>

    `;


    card.addEventListener(
      "click",
      ()=>{

        selectSlide(index,true);

      }
    );


    gallery.appendChild(card);

  });

}


/* =========================================
   BACKGROUND CHANGE
========================================= */

function changeBackground(index){

  const next =
    backgrounds[1-activeBackground];

  const old =
    backgrounds[activeBackground];


  next.style.backgroundImage =
    `url("${slides[index].img}")`;


  next.classList.remove("active");

  next.style.opacity = "0";

  next.style.transform =
    "scale(1.1) translateY(-3%)";


  next.offsetHeight;


  requestAnimationFrame(()=>{

    next.classList.add("active");

    next.style.opacity = "1";

    next.style.transform =
      "scale(1) translateY(2%)";

  });


  old.classList.remove("active");

  old.style.opacity = "0";


  activeBackground =
    1-activeBackground;
}


/* =========================================
   TEXT CHANGE
========================================= */

function changeText(index){

  content.classList.add(
    "content-changing"
  );


  setTimeout(()=>{

    heading.textContent =
      slides[index].heading;

    sub.textContent =
      slides[index].sub;

    location.textContent =
      slides[index].location;


    content.classList.remove(
      "content-changing"
    );

  },280);
}


/* =========================================
   ACTIVE CARD
========================================= */

function updateActiveCard(index){

  const cards =
    gallery.querySelectorAll(
      ".gallery-item"
    );


  cards.forEach((card,i)=>{

    card.classList.toggle(
      "active",
      i === index
    );

  });


  const activeCard =
    cards[index];


  /*
    MOST IMPORTANT PART:

    Active image always moves
    to the LEFT edge.
  */

  if(activeCard){

    const leftPosition =
      activeCard.offsetLeft -
      gallery.offsetLeft;


    gallery.scrollTo({

      left:leftPosition,

      behavior:"smooth"

    });

  }

}


/* =========================================
   SELECT SLIDE
========================================= */

function selectSlide(index,manual=false){

  current = index;

  changeBackground(index);

  changeText(index);

  updateActiveCard(index);


  if(manual){

    resetAutoplay();

  }

}


/* =========================================
   NEXT
========================================= */

function nextSlide(){

  const next =
    (current+1)%slides.length;

  selectSlide(next);

}


/* =========================================
   PREVIOUS
========================================= */

function previousSlide(){

  const previous =
    (current-1+slides.length)
    %slides.length;

  selectSlide(previous);

}


/* =========================================
   AUTOPLAY
========================================= */

function startAutoplay(){

  clearInterval(autoplay);

  autoplay =
    setInterval(
      nextSlide,
      AUTO_TIME
    );


  startProgress();

}


/* =========================================
   RESET AUTOPLAY
========================================= */

function resetAutoplay(){

  clearInterval(autoplay);

  cancelAnimationFrame(
    progressAnimation
  );

  progressBar.style.width =
    "0%";

  startAutoplay();

}


/* =========================================
   PROGRESS
========================================= */

function startProgress(){

  const start =
    performance.now();


  function animate(time){

    const elapsed =
      time-start;


    const percent =
      Math.min(
        elapsed/AUTO_TIME*100,
        100
      );


    progressBar.style.width =
      percent+"%";


    if(percent<100){

      progressAnimation =
        requestAnimationFrame(
          animate
        );

    }

  }


  progressAnimation =
    requestAnimationFrame(
      animate
    );

}


/* =========================================
   MOUSE WHEEL
   Vertical wheel becomes
   horizontal slider
========================================= */

gallery.addEventListener(
  "wheel",
  event=>{

    event.preventDefault();


    if(
      Math.abs(event.deltaY) < 5 &&
      Math.abs(event.deltaX) < 5
    ){
      return;
    }


    if(
      event.deltaY > 0 ||
      event.deltaX > 0
    ){

      nextSlide();

    }else{

      previousSlide();

    }


    resetAutoplay();

  },
  {
    passive:false
  }
);


/* =========================================
   DRAG
========================================= */

let dragging = false;

let startX = 0;

let startScroll = 0;


gallery.addEventListener(
  "pointerdown",
  event=>{

    dragging = true;

    gallery.classList.add(
      "dragging"
    );

    startX =
      event.clientX;

    startScroll =
      gallery.scrollLeft;

    gallery.setPointerCapture(
      event.pointerId
    );

  }
);


gallery.addEventListener(
  "pointermove",
  event=>{

    if(!dragging){
      return;
    }


    const distance =
      event.clientX-startX;


    gallery.scrollLeft =
      startScroll-distance;

  }
);


gallery.addEventListener(
  "pointerup",
  event=>{

    dragging = false;

    gallery.classList.remove(
      "dragging"
    );

    snapToNearest();

    resetAutoplay();

  }
);


/* =========================================
   SNAP TO NEAREST CARD
========================================= */

function snapToNearest(){

  const cards =
    [...gallery.querySelectorAll(
      ".gallery-item"
    )];


  let nearestIndex = 0;

  let nearestDistance =
    Infinity;


  cards.forEach((card,index)=>{

    const distance =
      Math.abs(
        card.offsetLeft -
        gallery.scrollLeft
      );


    if(distance<nearestDistance){

      nearestDistance =
        distance;

      nearestIndex =
        index;

    }

  });


  selectSlide(
    nearestIndex
  );

}


/* =========================================
   TOUCH SWIPE
========================================= */

let touchStartX = 0;


gallery.addEventListener(
  "touchstart",
  event=>{

    touchStartX =
      event.touches[0].clientX;

  },
  {
    passive:true
  }
);


gallery.addEventListener(
  "touchend",
  event=>{

    const endX =
      event.changedTouches[0].clientX;


    const difference =
      touchStartX-endX;


    if(Math.abs(difference)<40){

      return;

    }


    if(difference>0){

      nextSlide();

    }else{

      previousSlide();

    }


    resetAutoplay();

  },
  {
    passive:true
  }
);


/* =========================================
   KEYBOARD
========================================= */

document.addEventListener(
  "keydown",
  event=>{

    if(event.key==="ArrowRight"){

      nextSlide();

      resetAutoplay();

    }


    if(event.key==="ArrowLeft"){

      previousSlide();

      resetAutoplay();

    }

  }
);


/* =========================================
   PAUSE ON HOVER
========================================= */

gallery.addEventListener(
  "mouseenter",
  ()=>{

    clearInterval(autoplay);

    cancelAnimationFrame(
      progressAnimation
    );

  }
);


gallery.addEventListener(
  "mouseleave",
  ()=>{

    startAutoplay();

  }
);


/* =========================================
   INIT
========================================= */

function init(){

  backgrounds[0].style.backgroundImage =
    `url("${slides[0].img}")`;

  backgrounds[0].style.opacity =
    "1";

  backgrounds[0].style.transform =
    "scale(1) translateY(2%)";


  createSlider();

  updateActiveCard(0);

  startAutoplay();

}


init();

</script>

</body>
</html>
