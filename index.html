<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Northbound Expeditions — Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #14201E;
    --parchment: #F1EAD9;
    --stone: rgba(241,234,217,0.7);
    --gold: #C9973E;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; background:var(--ink); overflow-x:hidden; }
  body{ font-family:'Work Sans', sans-serif; }

  .hero{
    position:relative;
    width:100%;
    height:100vh;
    height:100dvh;
    min-height:560px;
    max-height:960px;
    overflow:hidden;
    background:var(--ink);
    color:var(--parchment);
  }

  /* ---------- background ---------- */
  .hero-bg{
    position:absolute; inset:0;
    background-size:cover;
    background-position:center;
    opacity:0;
    transition:opacity 1.3s ease;
    will-change:transform, opacity;
  }
  .hero-bg.is-active{
    opacity:1;
    animation:kenMove 6s linear forwards;
  }
  @keyframes kenMove{
    from{ transform:scale(1.05) translateY(-2%); }
    to{ transform:scale(1) translateY(2%); }
  }

  .hero-overlay{
    position:absolute; inset:0; z-index:1;
    background:
      linear-gradient(100deg, rgba(20,32,30,0.82) 0%, rgba(20,32,30,0.55) 38%, rgba(20,32,30,0.22) 62%, rgba(20,32,30,0.28) 100%);
    pointer-events:none;
  }

  /* ---------- text ---------- */
  .hero-text{
    position:absolute;
    left:6%;
    top:50%;
    transform:translateY(-50%);
    width:min(40%, 520px);
    z-index:2;
  }
  .hero-location{
    font-family:'Work Sans', sans-serif;
    font-size:0.78rem;
    font-weight:600;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 16px;
    transition:opacity .5s ease, transform .5s ease;
  }
  .hero-title{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(1.9rem, 4vw, 3.4rem);
    line-height:1.08;
    margin:0 0 18px;
    transition:opacity .5s ease, transform .5s ease;
  }
  .hero-desc{
    font-size:clamp(0.9rem, 1.5vw, 1.05rem);
    line-height:1.65;
    color:var(--stone);
    margin:0 0 26px;
    transition:opacity .5s ease, transform .5s ease;
  }
  .hero-cta{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:0.9rem;
    font-weight:500;
    color:var(--parchment);
    text-decoration:none;
    border-bottom:1px solid var(--gold);
    padding-bottom:5px;
    transition:opacity .5s ease, transform .5s ease, letter-spacing .3s ease;
  }
  .hero-cta:hover{ letter-spacing:0.03em; }

  .hero-text.is-switching .hero-location,
  .hero-text.is-switching .hero-title,
  .hero-text.is-switching .hero-desc,
  .hero-text.is-switching .hero-cta{
    opacity:0;
    transform:translateY(10px);
  }

  /* ---------- slider ---------- */
  .slider-wrap{
    position:absolute;
    left:40%;
    right:0;
    top:50%;
    transform:translateY(-50%);
    z-index:2;
    overflow:hidden;
  }
  .slider{
    display:flex;
    align-items:center;
    gap:18px;
    overflow-x:auto;
    overflow-y:visible;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    touch-action:pan-x;
    padding:14px 6%;
    margin:0;
    list-style:none;
    scrollbar-width:none;
    cursor:grab;
  }
  .slider::-webkit-scrollbar{ display:none; }
  .slider:active{ cursor:grabbing; }
  .slider:focus-visible{ outline:2px solid var(--gold); outline-offset:6px; }

  .card{
    position:relative;
    flex-shrink:0;
    width:clamp(110px, 12vw, 170px);
    aspect-ratio:3 / 4;
    border-radius:16px;
    overflow:hidden;
    scroll-snap-align:start;
    opacity:0.5;
    filter:saturate(0.85) brightness(0.8);
    box-shadow:0 14px 30px rgba(0,0,0,0.3);
    transition:opacity .5s ease, filter .5s ease, box-shadow .5s ease, transform .35s ease;
    cursor:pointer;
  }
  .card img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    pointer-events:none;
  }
  .card:hover{ transform:translateY(-5px); }
  .card.is-active{
    opacity:1;
    filter:saturate(1) brightness(1.05);
    box-shadow:0 0 0 2px rgba(201,151,62,0.85), 0 20px 42px rgba(0,0,0,0.4);
    transform:scale(1.02);
  }

  @media (max-width:900px){
    .hero-text{ width:min(52%, 460px); }
    .slider-wrap{ left:0; }
    .slider{ padding:14px 5%; }
  }

  @media (max-width:600px){
    .hero-text{ left:5%; width:88%; top:20%; transform:none; }
    .slider-wrap{ left:5%; right:5%; top:auto; bottom:8%; transform:none; }
    .card{ width:clamp(90px, 26vw, 120px); }
  }

  @media (prefers-reduced-motion:reduce){
    .hero-bg{ animation:none !important; transform:none !important; }
    .card, .hero-location, .hero-title, .hero-desc, .hero-cta{ transition:none !important; }
    .slider{ scroll-behavior:auto; }
  }
</style>
</head>
<body>

<section class="hero" aria-label="Destination showcase">
  <div class="hero-bg" id="bgA" aria-hidden="true"></div>
  <div class="hero-bg" id="bgB" aria-hidden="true"></div>
  <div class="hero-overlay" aria-hidden="true"></div>

  <div class="hero-text" id="heroText">
    <p class="hero-location" id="heroLocation"></p>
    <h1 class="hero-title" id="heroTitle"></h1>
    <p class="hero-desc" id="heroDesc"></p>
    <a href="#" class="hero-cta" id="heroCta"><span id="heroCtaLabel"></span> →</a>
  </div>

  <div class="slider-wrap">
    <div class="slider" id="slider" role="listbox" aria-label="Destinations" tabindex="0"></div>
  </div>
</section>

<script>
(function(){
  const slides = [
    {
      img: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=1600&q=80',
      location: 'Svalbard, Norway',
      title: 'Where the ice remembers',
      desc: 'Polar landscapes, endless summer light, and wilderness at the edge of the Arctic.',
      cta: 'Explore the route'
    },
    {
      img: 'https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1600&q=80',
      location: 'Faroe Islands',
      title: 'Cliffs that outlast the wind',
      desc: 'Turf-roofed villages tucked beneath sea cliffs older than memory.',
      cta: 'Plan the crossing'
    },
    {
      img: 'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1600&q=80',
      location: 'Patagonia, Chile',
      title: 'Granite against the sky',
      desc: 'Glacial towers standing watch over impossibly blue water.',
      cta: 'Trace the trail'
    },
    {
      img: 'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1600&q=80',
      location: 'Fiordland, New Zealand',
      title: 'A quiet the size of a valley',
      desc: 'Rainforest and mist folded into ancient, water-carved fjords.',
      cta: 'Chart the fjord'
    },
    {
      img: 'https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1600&q=80',
      location: 'Kamchatka, Russia',
      title: 'Fire under permanent frost',
      desc: 'Volcanoes and hot springs at the edge of the Pacific Ring of Fire.',
      cta: 'Follow the ridge'
    },
    {
      img: 'https://images.unsplash.com/photo-1454496522488-7a8e488e8606?auto=format&fit=crop&w=1600&q=80',
      location: 'Ladakh, India',
      title: 'A desert carved from cold',
      desc: 'High mountain passes and monasteries suspended above the clouds.',
      cta: 'Climb the pass'
    }
  ];

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const AUTOPLAY_MS = 6000;

  const sliderEl = document.getElementById('slider');
  const heroText = document.getElementById('heroText');
  const bgs = [document.getElementById('bgA'), document.getElementById('bgB')];
  const locationEl = document.getElementById('heroLocation');
  const titleEl = document.getElementById('heroTitle');
  const descEl = document.getElementById('heroDesc');
  const ctaLabelEl = document.getElementById('heroCtaLabel');

  let activeBg = 0;
  let currentIndex = -1;
  let cards = [];
  let autoplayTimer = null;
  let suppressClick = false;

  function buildCards(){
    slides.forEach((s, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.setAttribute('role', 'option');
      card.setAttribute('aria-selected', 'false');
      card.dataset.index = i;

      const img = document.createElement('img');
      img.src = s.img;
      img.alt = s.location + ' — ' + s.title;
      img.loading = i < 3 ? 'eager' : 'lazy';
      card.appendChild(img);

      card.addEventListener('click', () => {
        if (suppressClick) return;
        goTo(i, true);
      });

      sliderEl.appendChild(card);
      cards.push(card);
    });

    // trailing space so the final card can still reach the slider's left edge
    const spacer = document.createElement('div');
    spacer.style.flex = '0 0 1px';
    spacer.setAttribute('aria-hidden', 'true');
    sliderEl.appendChild(spacer);
    sizeTrailingSpace();
  }

  function sizeTrailingSpace(){
    const spacer = sliderEl.lastElementChild;
    if (!spacer) return;
    const wrapWidth = sliderEl.parentElement.clientWidth;
    const cardWidth = cards[0] ? cards[0].getBoundingClientRect().width : 160;
    spacer.style.flexBasis = Math.max(wrapWidth - cardWidth - 40, 0) + 'px';
  }

  function crossfadeBg(imgUrl){
    const incoming = bgs[1 - activeBg];
    const outgoing = bgs[activeBg];
    incoming.style.backgroundImage = 'url(' + imgUrl + ')';
    incoming.classList.remove('is-active');
    void incoming.offsetWidth; // restart animation
    incoming.classList.add('is-active');
    outgoing.classList.remove('is-active');
    activeBg = 1 - activeBg;
  }

  function setText(slide){
    locationEl.textContent = slide.location.toUpperCase();
    titleEl.textContent = slide.title;
    descEl.textContent = slide.desc;
    ctaLabelEl.textContent = slide.cta;
  }

  function switchText(slide){
    if (reduceMotion){ setText(slide); return; }
    heroText.classList.add('is-switching');
    setTimeout(() => {
      setText(slide);
      heroText.classList.remove('is-switching');
    }, 260);
  }

  function goTo(index, smooth){
    const card = cards[index];
    if (!card) return;
    sliderEl.scrollTo({ left: card.offsetLeft - parseFloat(getComputedStyle(sliderEl).paddingLeft || 0), behavior: smooth ? 'smooth' : 'auto' });
  }

  function setActive(index){
    if (index === currentIndex) return;
    currentIndex = index;
    cards.forEach((c, i) => {
      c.classList.toggle('is-active', i === index);
      c.setAttribute('aria-selected', i === index ? 'true' : 'false');
    });
    crossfadeBg(slides[index].img);
    switchText(slides[index]);
  }

  function nearestIndex(){
    const wrapLeft = sliderEl.getBoundingClientRect().left + parseFloat(getComputedStyle(sliderEl).paddingLeft || 0);
    let best = 0, bestDist = Infinity;
    cards.forEach((c, i) => {
      const dist = Math.abs(c.getBoundingClientRect().left - wrapLeft);
      if (dist < bestDist){ bestDist = dist; best = i; }
    });
    return best;
  }

  let scrollTicking = false;
  sliderEl.addEventListener('scroll', () => {
    if (scrollTicking) return;
    scrollTicking = true;
    requestAnimationFrame(() => {
      setActive(nearestIndex());
      scrollTicking = false;
    });
  });

  // wheel -> horizontal
  sliderEl.addEventListener('wheel', (e) => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)){
      e.preventDefault();
      sliderEl.scrollLeft += e.deltaY;
    }
    resetAutoplay();
  }, { passive: false });

  // keyboard
  sliderEl.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight'){ e.preventDefault(); goTo(Math.min(currentIndex + 1, cards.length - 1), true); resetAutoplay(); }
    if (e.key === 'ArrowLeft'){ e.preventDefault(); goTo(Math.max(currentIndex - 1, 0), true); resetAutoplay(); }
  });

  // mouse drag
  let dragging = false, dragStartX = 0, dragStartScroll = 0, dragDistance = 0;
  sliderEl.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'mouse') { resetAutoplay(); return; }
    dragging = true;
    dragDistance = 0;
    dragStartX = e.clientX;
    dragStartScroll = sliderEl.scrollLeft;
    sliderEl.style.scrollSnapType = 'none';
    resetAutoplay();
  });
  window.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const delta = e.clientX - dragStartX;
    dragDistance = Math.abs(delta);
    sliderEl.scrollLeft = dragStartScroll - delta;
  });
  window.addEventListener('pointerup', () => {
    if (!dragging) return;
    dragging = false;
    sliderEl.style.scrollSnapType = 'x mandatory';
    suppressClick = dragDistance > 6;
    goTo(nearestIndex(), true);
    setTimeout(() => { suppressClick = false; }, 50);
  });

  sliderEl.addEventListener('touchstart', resetAutoplay, { passive: true });

  function resetAutoplay(){
    clearTimeout(autoplayTimer);
    scheduleAutoplay();
  }
  function scheduleAutoplay(){
    autoplayTimer = setTimeout(() => {
      const next = (currentIndex + 1) % cards.length;
      goTo(next, true);
      scheduleAutoplay();
    }, AUTOPLAY_MS);
  }

  window.addEventListener('resize', sizeTrailingSpace);

  buildCards();
  crossfadeBg(slides[0].img);
  setText(slides[0]);
  cards[0].classList.add('is-active');
  cards[0].setAttribute('aria-selected', 'true');
  currentIndex = 0;
  if (!reduceMotion) scheduleAutoplay();
})();
</script>

</body>
</html>
