<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Northbound Expeditions</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --ink: #14201e;
  --cream: #f1ead9;
  --muted: rgba(241, 234, 217, .68);
  --gold: #c9973e;
  --dark: rgba(20, 32, 30, .92);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: var(--ink);
}

body {
  font-family: "Work Sans", sans-serif;
  overflow: hidden;
}


/* =========================
   HERO
========================= */

.hero {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  min-height: 560px;
  overflow: hidden;
  color: var(--cream);
  background: var(--ink);
}


/* =========================
   BACKGROUND
========================= */

.hero-bg {
  position: absolute;
  inset: -4%;
  z-index: 1;

  background-size: cover;
  background-position: center bottom;
  background-repeat: no-repeat;

  opacity: 0;

  transform: scale(1.08) translateY(-2%);

  transition:
    opacity 1s ease,
    transform 5s cubic-bezier(.22, .61, .36, 1);
}

.hero-bg.active {
  opacity: 1;
  transform: scale(1) translateY(2%);
}


/* =========================
   DARK GRADIENT
========================= */

.hero-overlay {
  position: absolute;
  inset: 0;
  z-index: 2;

  background:
    linear-gradient(
      100deg,
      rgba(20, 32, 30, .95) 0%,
      rgba(20, 32, 30, .76) 30%,
      rgba(20, 32, 30, .34) 58%,
      rgba(20, 32, 30, .08) 82%
    );
}


/* =========================
   CONTENT
========================= */

.hero-content {
  position: absolute;
  left: 6%;
  top: 50%;
  transform: translateY(-50%);

  width: min(520px, 43vw);

  z-index: 5;
}

.hero-kicker {
  display: flex;
  align-items: center;
  gap: 12px;

  margin-bottom: 22px;

  font-size: 11px;
  letter-spacing: .22em;
  text-transform: uppercase;

  color: var(--gold);
}

.hero-kicker::before {
  content: "";
  width: 34px;
  height: 1px;
  background: var(--gold);
}

.hero-heading {
  margin: 0 0 18px;

  font-family: "Fraunces", serif;
  font-style: italic;
  font-weight: 500;

  font-size: clamp(2rem, 4.5vw, 4.4rem);
  line-height: 1.04;
  letter-spacing: -.025em;

  transition:
    opacity .45s ease,
    transform .55s ease;
}

.hero-sub {
  max-width: 500px;

  margin: 0 0 30px;

  font-size: clamp(.82rem, 1.3vw, 1rem);
  line-height: 1.75;

  color: var(--muted);

  transition:
    opacity .45s ease,
    transform .55s ease;
}


/* =========================
   LOCATION
========================= */

.hero-location {
  display: inline-flex;
  align-items: center;
  gap: 8px;

  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;

  color: rgba(241, 234, 217, .52);
}

.hero-location span {
  width: 5px;
  height: 5px;

  border-radius: 50%;

  background: var(--gold);
}


/* =========================
   GALLERY
========================= */

.gallery {
  position: absolute;

  right: 5%;
  top: 50%;
  transform: translateY(-50%);

  z-index: 6;

  width: min(470px, 39vw);
  height: min(72vh, 590px);

  overflow-y: auto;
  overflow-x: hidden;

  padding: 70px 18px 70px 10px;

  scroll-behavior: smooth;

  scrollbar-width: none;

  cursor: grab;
}

.gallery::-webkit-scrollbar {
  display: none;
}

.gallery.dragging {
  cursor: grabbing;
}


/* =========================
   GALLERY ITEM
========================= */

.gallery-item {
  position: relative;

  width: min(250px, 19vw);
  height: 310px;

  margin-left: auto;
  margin-bottom: 20px;

  border-radius: 28px;

  overflow: hidden;

  background: #222;

  border: 1px solid rgba(241, 234, 217, .12);

  opacity: .52;

  transform:
    scale(.88)
    translateX(12px);

  transition:
    transform .7s cubic-bezier(.22, .61, .36, 1),
    opacity .5s ease,
    border-color .5s ease,
    box-shadow .5s ease;

  cursor: pointer;
}

.gallery-item:hover {
  opacity: .82;

  transform:
    scale(.93)
    translateX(0);
}

.gallery-item.active {
  opacity: 1;

  transform:
    scale(1)
    translateX(0);

  border-color:
    rgba(201, 151, 62, .8);

  box-shadow:
    0 25px 70px rgba(0, 0, 0, .45);
}


/* =========================
   IMAGE
========================= */

.gallery-image {
  width: 100%;
  height: 100%;

  object-fit: cover;

  display: block;

  transition:
    transform 1s cubic-bezier(.22, .61, .36, 1);
}

.gallery-item:hover .gallery-image {
  transform: scale(1.05);
}


/* =========================
   IMAGE GRADIENT
========================= */

.gallery-item::after {
  content: "";

  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      to top,
      rgba(20, 32, 30, .65),
      transparent 55%
    );

  pointer-events: none;
}


/* =========================
   NUMBER
========================= */

.gallery-number {
  position: absolute;

  left: 18px;
  bottom: 17px;

  z-index: 2;

  font-size: 10px;
  letter-spacing: .18em;

  color: rgba(241, 234, 217, .8);
}


/* =========================
   SELECT INDICATOR
========================= */

.gallery-item.active .gallery-number {
  color: var(--gold);
}


/* =========================
   PROGRESS
========================= */

.hero-progress {
  position: absolute;

  left: 6%;
  bottom: 7%;

  z-index: 7;

  width: 120px;
  height: 2px;

  overflow: hidden;

  background:
    rgba(241, 234, 217, .18);
}

.hero-progress-bar {
  width: 0;
  height: 100%;

  background: var(--gold);

  transition: width .1s linear;
}


/* =========================
   NAVIGATION HINT
========================= */

.gallery-hint {
  position: absolute;

  right: 5%;
  bottom: 7%;

  z-index: 7;

  display: flex;
  align-items: center;
  gap: 10px;

  font-size: 10px;
  letter-spacing: .16em;
  text-transform: uppercase;

  color: rgba(241, 234, 217, .45);
}

.gallery-hint::before {
  content: "↕";

  font-size: 18px;
  color: var(--gold);
}


/* =========================
   TEXT ANIMATION
========================= */

.content-changing .hero-heading,
.content-changing .hero-sub,
.content-changing .hero-location {
  opacity: 0;
  transform: translateY(16px);
}


/* =========================
   TABLET
========================= */

@media (max-width: 900px) {

  .hero-content {
    left: 5%;
    width: 46vw;
  }

  .gallery {
    right: 3%;
    width: 42vw;
  }

  .gallery-item {
    width: 22vw;
    height: 270px;
  }
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

  body {
    overflow: hidden;
  }

  .hero {
    min-height: 600px;
  }

  .hero-overlay {
    background:
      linear-gradient(
        100deg,
        rgba(20, 32, 30, .94) 0%,
        rgba(20, 32, 30, .65) 52%,
        rgba(20, 32, 30, .18) 100%
      );
  }

  .hero-content {
    left: 6%;
    top: 50%;

    width: 45vw;

    transform: translateY(-50%);
  }

  .hero-heading {
    font-size: clamp(1.65rem, 6vw, 2.5rem);
  }

  .hero-sub {
    font-size: .76rem;
    line-height: 1.55;
  }

  .hero-kicker {
    font-size: 8px;
    margin-bottom: 15px;
  }

  .gallery {
    right: 3%;
    width: 45vw;

    height: 70vh;

    padding-top: 80px;
    padding-bottom: 80px;
  }

  .gallery-item {
    width: 38vw;
    height: 210px;

    border-radius: 21px;

    margin-bottom: 14px;
  }

  .gallery-hint {
    display: none;
  }

  .hero-progress {
    left: 6%;
    bottom: 5%;
  }
}


/* =========================
   SMALL MOBILE
========================= */

@media (max-width: 480px) {

  .hero-content {
    left: 6%;
    width: 43vw;
  }

  .hero-heading {
    font-size: 1.55rem;
  }

  .hero-sub {
    font-size: .7rem;
  }

  .gallery {
    width: 47vw;
  }

  .gallery-item {
    width: 40vw;
    height: 185px;
  }
}


/* =========================
   REDUCED MOTION
========================= */

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition: none !important;
    animation: none !important;
  }
}
</style>
</head>


<body>

<section class="hero">

  <!-- Background layers -->
  <div class="hero-bg active" id="bgA"></div>
  <div class="hero-bg" id="bgB"></div>

  <!-- Dark overlay -->
  <div class="hero-overlay"></div>


  <!-- Hero Content -->
  <div class="hero-content" id="heroContent">

    <div class="hero-kicker">
      Northbound Expeditions
    </div>

    <h1 class="hero-heading" id="heroHeading">
      Where the ice remembers
    </h1>

    <p class="hero-sub" id="heroSub">
      Svalbard, Norway — polar bear country at eighty degrees north, where the summer sun never sets.
    </p>

    <div class="hero-location">
      <span></span>
      <strong id="heroLocation">Svalbard, Norway</strong>
    </div>

  </div>


  <!-- Vertical Gallery -->
  <div class="gallery" id="gallery"></div>


  <!-- Progress -->
  <div class="hero-progress">
    <div class="hero-progress-bar" id="progressBar"></div>
  </div>


  <!-- Gallery Hint -->
  <div class="gallery-hint">
    Scroll to explore
  </div>

</section>


<script>

/* =========================================
   EXPEDITION DATA
========================================= */

const slides = [

  {
    img: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=1600&q=85",
    heading: "Where the ice remembers",
    sub: "Svalbard, Norway — polar bear country at eighty degrees north, where the summer sun never sets.",
    location: "Svalbard, Norway"
  },

  {
    img: "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1600&q=85",
    heading: "Cliffs that outlast the wind",
    sub: "The Faroe Islands — turf-roofed villages tucked beneath sea cliffs older than memory.",
    location: "Faroe Islands"
  },

  {
    img: "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1600&q=85",
    heading: "Granite against the sky",
    sub: "Torres del Paine, Patagonia — glacial towers standing over turquoise water.",
    location: "Patagonia, Chile"
  },

  {
    img: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1600&q=85",
    heading: "A quiet the size of a valley",
    sub: "Fiordland, New Zealand — rainforest and mist folded into ancient fjords.",
    location: "Fiordland, New Zealand"
  },

  {
    img: "https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1600&q=85",
    heading: "Fire under permanent frost",
    sub: "Kamchatka, Russia — volcanoes and hot springs at the edge of the Pacific.",
    location: "Kamchatka, Russia"
  },

  {
    img: "https://images.unsplash.com/photo-1454496522488-7a8e488e8606?auto=format&fit=crop&w=1600&q=85",
    heading: "A desert carved from cold",
    sub: "Ladakh, India — high mountain passes and monasteries above the clouds.",
    location: "Ladakh, India"
  }

];


/* =========================================
   ELEMENTS
========================================= */

const gallery =
  document.getElementById("gallery");

const heading =
  document.getElementById("heroHeading");

const sub =
  document.getElementById("heroSub");

const locationText =
  document.getElementById("heroLocation");

const heroContent =
  document.getElementById("heroContent");

const progressBar =
  document.getElementById("progressBar");

const backgrounds = [
  document.getElementById("bgA"),
  document.getElementById("bgB")
];


/* =========================================
   STATE
========================================= */

let current = 0;
let activeBackground = 0;

let autoplayTimer = null;

let progressTimer = null;

const AUTO_PLAY_TIME = 5000;


/* =========================================
   CREATE GALLERY
========================================= */

function createGallery() {

  slides.forEach((slide, index) => {

    const item =
      document.createElement("div");

    item.className = "gallery-item";

    if (index === 0) {
      item.classList.add("active");
    }

    item.dataset.index = index;

    item.innerHTML = `
      <img
        class="gallery-image"
        src="${slide.img}"
        alt="${slide.heading}"
        loading="${index === 0 ? "eager" : "lazy"}"
      >

      <div class="gallery-number">
        ${String(index + 1).padStart(2, "0")}
      </div>
    `;


    item.addEventListener("click", () => {

      selectSlide(index, true);

    });


    gallery.appendChild(item);

  });

}


/* =========================================
   CHANGE BACKGROUND
========================================= */

function changeBackground(index) {

  const nextBg =
    backgrounds[1 - activeBackground];

  const oldBg =
    backgrounds[activeBackground];


  nextBg.style.backgroundImage =
    `url("${slides[index].img}")`;

  nextBg.classList.remove("active");


  /*
    Reset starting position.
    Image starts slightly above
    and settles downward.
  */

  nextBg.style.transform =
    "scale(1.10) translateY(-3%)";


  nextBg.style.opacity = "0";


  /* Force repaint */

  nextBg.offsetHeight;


  requestAnimationFrame(() => {

    nextBg.classList.add("active");

    nextBg.style.opacity = "1";

    nextBg.style.transform =
      "scale(1) translateY(2%)";

  });


  oldBg.classList.remove("active");

  oldBg.style.opacity = "0";


  activeBackground =
    1 - activeBackground;
}


/* =========================================
   CHANGE TEXT
========================================= */

function changeText(index) {

  heroContent.classList.add("content-changing");


  setTimeout(() => {

    heading.textContent =
      slides[index].heading;

    sub.textContent =
      slides[index].sub;

    locationText.textContent =
      slides[index].location;


    heroContent.classList.remove(
      "content-changing"
    );

  }, 280);

}


/* =========================================
   UPDATE ACTIVE CARD
========================================= */

function updateGallery(index) {

  const items =
    gallery.querySelectorAll(".gallery-item");


  items.forEach((item, i) => {

    item.classList.toggle(
      "active",
      i === index
    );

  });


  /*
    Automatically bring selected
    image into the visible center.
  */

  const selected =
    items[index];

  if (selected) {

    selected.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });

  }

}


/* =========================================
   SELECT SLIDE
========================================= */

function selectSlide(index, manual = false) {

  if (index === current && !manual) {
    return;
  }


  current = index;


  changeBackground(index);

  changeText(index);

  updateGallery(index);


  /*
    Manual click resets autoplay.
  */

  if (manual) {

    resetAutoplay();

  }

}


/* =========================================
   NEXT SLIDE
========================================= */

function nextSlide() {

  const next =
    (current + 1) % slides.length;

  selectSlide(next);

}


/* =========================================
   PREVIOUS SLIDE
========================================= */

function previousSlide() {

  const previous =
    (current - 1 + slides.length)
    % slides.length;

  selectSlide(previous);

}


/* =========================================
   AUTOPLAY
========================================= */

function startAutoplay() {

  clearInterval(autoplayTimer);

  autoplayTimer =
    setInterval(
      nextSlide,
      AUTO_PLAY_TIME
    );

  startProgress();

}


/* =========================================
   RESET AUTOPLAY
========================================= */

function resetAutoplay() {

  clearInterval(autoplayTimer);

  clearInterval(progressTimer);

  progressBar.style.width = "0%";


  startAutoplay();

}


/* =========================================
   PROGRESS BAR
========================================= */

function startProgress() {

  let start =
    performance.now();


  progressBar.style.width = "0%";


  function animate(now) {

    const elapsed =
      now - start;

    const percent =
      Math.min(
        (elapsed / AUTO_PLAY_TIME) * 100,
        100
      );


    progressBar.style.width =
      percent + "%";


    if (percent < 100) {

      progressTimer =
        requestAnimationFrame(animate);

    }

  }


  progressTimer =
    requestAnimationFrame(animate);

}


/* =========================================
   MOUSE WHEEL
   Manual vertical navigation
========================================= */

gallery.addEventListener(
  "wheel",
  event => {

    event.preventDefault();


    if (
      Math.abs(event.deltaY) < 5
    ) {
      return;
    }


    if (event.deltaY > 0) {

      nextSlide();

    } else {

      previousSlide();

    }


    resetAutoplay();

  },
  {
    passive: false
  }
);


/* =========================================
   TOUCH / SWIPE
========================================= */

let touchStartY = 0;

gallery.addEventListener(
  "touchstart",
  event => {

    touchStartY =
      event.touches[0].clientY;

  },
  {
    passive: true
  }
);


gallery.addEventListener(
  "touchend",
  event => {

    const touchEndY =
      event.changedTouches[0].clientY;

    const difference =
      touchStartY - touchEndY;


    if (Math.abs(difference) < 40) {
      return;
    }


    if (difference > 0) {

      nextSlide();

    } else {

      previousSlide();

    }


    resetAutoplay();

  },
  {
    passive: true
  }
);


/* =========================================
   DRAG TO SCROLL
========================================= */

let isDragging = false;
let dragStart = 0;
let scrollStart = 0;


gallery.addEventListener(
  "pointerdown",
  event => {

    isDragging = true;

    gallery.classList.add("dragging");

    dragStart = event.clientY;

    scrollStart = gallery.scrollTop;

    gallery.setPointerCapture(
      event.pointerId
    );

  }
);


gallery.addEventListener(
  "pointermove",
  event => {

    if (!isDragging) {
      return;
    }


    const distance =
      event.clientY - dragStart;


    gallery.scrollTop =
      scrollStart - distance;

  }
);


gallery.addEventListener(
  "pointerup",
  () => {

    isDragging = false;

    gallery.classList.remove(
      "dragging"
    );

  }
);


/* =========================================
   KEYBOARD
========================================= */

document.addEventListener(
  "keydown",
  event => {

    if (event.key === "ArrowDown") {

      nextSlide();

      resetAutoplay();

    }


    if (event.key === "ArrowUp") {

      previousSlide();

      resetAutoplay();

    }

  }
);


/* =========================================
   PAUSE WHEN MOUSE OVER GALLERY
========================================= */

gallery.addEventListener(
  "mouseenter",
  () => {

    clearInterval(autoplayTimer);

    clearInterval(progressTimer);

  }
);


gallery.addEventListener(
  "mouseleave",
  () => {

    startAutoplay();

  }
);


/* =========================================
   INITIALIZE
========================================= */

function init() {

  backgrounds[0].style.backgroundImage =
    `url("${slides[0].img}")`;

  backgrounds[0].style.transform =
    "scale(1) translateY(2%)";

  createGallery();

  updateGallery(0);

  startAutoplay();

}


init();

</script>

</body>
</html>
