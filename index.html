<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Northbound Expeditions — Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #14201E;
    --parchment: #F1EAD9;
    --stone: rgba(241,234,217,0.7);
    --gold: #C9973E;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; background:var(--ink); overflow-x:hidden; }
  body{ font-family:'Work Sans', sans-serif; }

  .hero{
    position:relative;
    width:100%;
    height:100vh;
    height:100dvh;
    min-height:420px;
    overflow:hidden;
    background:var(--ink);
    color:var(--parchment);
  }

  /* fixed-size design, scaled uniformly to fill any viewport so the
     layout looks identical on mobile and desktop */
  .hero-canvas{
    position:absolute;
    top:0; left:0;
    width:1280px;
    height:720px;
    transform-origin:top left;
  }

  /* ---------- background ---------- */
  .hero-bg{
    position:absolute; inset:0;
    background-size:cover;
    background-position:center;
    opacity:0;
    transition:opacity 1.3s ease;
    will-change:transform, opacity;
  }
  .hero-bg.is-active{
    opacity:1;
    animation:kenMove 6s linear forwards;
  }
  @keyframes kenMove{
    from{ transform:scale(1.05) translateY(-2%); }
    to{ transform:scale(1) translateY(2%); }
  }

  .hero-overlay{
    position:absolute; inset:0; z-index:1;
    background:
      linear-gradient(100deg, rgba(20,32,30,0.82) 0%, rgba(20,32,30,0.55) 38%, rgba(20,32,30,0.22) 62%, rgba(20,32,30,0.28) 100%);
    pointer-events:none;
  }

  /* ---------- text ---------- */
  .hero-text{
    position:absolute;
    left:80px;
    top:50%;
    transform:translateY(-50%);
    width:480px;
    z-index:2;
  }
  .hero-location{
    font-family:'Work Sans', sans-serif;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 16px;
    transition:opacity .5s ease, transform .5s ease;
  }
  .hero-title{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:54px;
    line-height:1.08;
    margin:0 0 18px;
    transition:opacity .5s ease, transform .5s ease;
  }
  .hero-desc{
    font-size:17px;
    line-height:1.65;
    color:var(--stone);
    margin:0 0 26px;
    transition:opacity .5s ease, transform .5s ease;
  }
  .hero-cta{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:15px;
    font-weight:500;
    color:var(--parchment);
    text-decoration:none;
    border-bottom:1px solid var(--gold);
    padding-bottom:5px;
    transition:opacity .5s ease, transform .5s ease, letter-spacing .3s ease;
  }
  .hero-cta:hover{ letter-spacing:0.03em; }

  .hero-text.is-switching .hero-location,
  .hero-text.is-switching .hero-title,
  .hero-text.is-switching .hero-desc,
  .hero-text.is-switching .hero-cta{
    opacity:0;
    transform:translateY(10px);
  }

  /* ---------- vertical card stack ---------- */
  .stack-wrap{
    position:absolute;
    right:90px;
    top:50%;
    transform:translateY(-50%);
    z-index:2;
  }
  .stack{
    position:relative;
  }
  .stack-card{
    position:absolute;
    top:0; left:0;
    border-radius:18px;
    overflow:hidden;
    cursor:pointer;
    box-shadow:0 18px 40px rgba(0,0,0,0.4);
    transition:
      top .75s cubic-bezier(.65,0,.35,1),
      left .75s cubic-bezier(.65,0,.35,1),
      width .75s cubic-bezier(.65,0,.35,1),
      height .75s cubic-bezier(.65,0,.35,1),
      opacity .6s ease,
      filter .6s ease,
      transform .3s ease;
  }
  .stack-card img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    pointer-events:none;
  }
  .stack-card:hover{ transform:scale(1.03); }
  .stack-card[data-slot="0"]{
    box-shadow:0 0 0 2px rgba(201,151,62,0.85), 0 22px 46px rgba(0,0,0,0.45);
  }
  .stack-card.entering{ opacity:0 !important; }
  .stack-card.exiting{ opacity:0 !important; }

  /* ---------- navbar ---------- */
  .navbar{
    position:absolute;
    top:0; left:0; right:0;
    z-index:5;
    display:flex;
    justify-content:center;
    padding:26px 0;
    background:transparent;
    pointer-events:none;
  }
  .navbar-brand{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:17px;
    letter-spacing:0.05em;
    color:var(--parchment);
    background:transparent;
    pointer-events:auto;
  }

  @media (prefers-reduced-motion:reduce){
    .hero-bg{ animation:none !important; transform:none !important; }
    .stack-card, .hero-location, .hero-title, .hero-desc, .hero-cta{ transition:none !important; }
  }
</style>
</head>
<body>

<section class="hero" aria-label="Destination showcase">
  <div class="hero-canvas" id="heroCanvas">
    <nav class="navbar" aria-label="Primary">
      <span class="navbar-brand">Northbound</span>
    </nav>

    <div class="hero-bg" id="bgA" aria-hidden="true"></div>
    <div class="hero-bg" id="bgB" aria-hidden="true"></div>
    <div class="hero-overlay" aria-hidden="true"></div>

    <div class="hero-text" id="heroText">
      <p class="hero-location" id="heroLocation"></p>
      <h1 class="hero-title" id="heroTitle"></h1>
      <p class="hero-desc" id="heroDesc"></p>
      <a href="#" class="hero-cta" id="heroCta"><span id="heroCtaLabel"></span> →</a>
    </div>

    <div class="stack-wrap">
      <div class="stack" id="stack" role="listbox" aria-label="Destinations"></div>
    </div>
  </div>
</section>

<script>
(function(){
  const slides = [
    {
      img: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=1600&q=80',
      location: 'Svalbard, Norway',
      title: 'Where the ice remembers',
      desc: 'Polar landscapes, endless summer light, and wilderness at the edge of the Arctic.',
      cta: 'Explore the route'
    },
    {
      img: 'https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1600&q=80',
      location: 'Faroe Islands',
      title: 'Cliffs that outlast the wind',
      desc: 'Turf-roofed villages tucked beneath sea cliffs older than memory.',
      cta: 'Plan the crossing'
    },
    {
      img: 'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1600&q=80',
      location: 'Patagonia, Chile',
      title: 'Granite against the sky',
      desc: 'Glacial towers standing watch over impossibly blue water.',
      cta: 'Trace the trail'
    },
    {
      img: 'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1600&q=80',
      location: 'Fiordland, New Zealand',
      title: 'A quiet the size of a valley',
      desc: 'Rainforest and mist folded into ancient, water-carved fjords.',
      cta: 'Chart the fjord'
    },
    {
      img: 'https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1600&q=80',
      location: 'Kamchatka, Russia',
      title: 'Fire under permanent frost',
      desc: 'Volcanoes and hot springs at the edge of the Pacific Ring of Fire.',
      cta: 'Follow the ridge'
    },
    {
      img: 'https://images.unsplash.com/photo-1454496522488-7a8e488e8606?auto=format&fit=crop&w=1600&q=80',
      location: 'Ladakh, India',
      title: 'A desert carved from cold',
      desc: 'High mountain passes and monasteries suspended above the clouds.',
      cta: 'Climb the pass'
    }
  ];

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const AUTOPLAY_MS = 5500;
  const CARD_RATIO = 1.85;                    // front card height = width * CARD_RATIO
  const OFFSET_RATIOS = [0, 0.33, 0.56];       // each card's left offset, as a ratio of card width
  const HEIGHT_RATIOS = [1, 0.84, 0.68];       // each card's height, relative to the front card
  const OPACITIES     = [1, 0.55, 0.32];
  const BRIGHTNESS    = [1.05, 0.72, 0.55];
  const ZS            = [3, 2, 1];

  const stackEl = document.getElementById('stack');
  const heroText = document.getElementById('heroText');
  const bgs = [document.getElementById('bgA'), document.getElementById('bgB')];
  const locationEl = document.getElementById('heroLocation');
  const titleEl = document.getElementById('heroTitle');
  const descEl = document.getElementById('heroDesc');
  const ctaLabelEl = document.getElementById('heroCtaLabel');

  let activeBg = 0;
  let currentIndex = 0;
  let stackCards = [];   // live DOM nodes, front-to-back
  let autoplayTimer = null;

  function slideAt(i){
    const len = slides.length;
    return slides[((i % len) + len) % len];
  }

  function getSlotDefs(){
    const W = 240;
    const H1 = Math.round(W * CARD_RATIO);
    return OFFSET_RATIOS.map((ratio, i) => ({
      left: Math.round(ratio * W),
      width: W,
      height: Math.round(H1 * HEIGHT_RATIOS[i]),
      opacity: OPACITIES[i],
      brightness: BRIGHTNESS[i],
      z: ZS[i]
    }));
  }

  const SLOT_DEF = getSlotDefs();

  function sizeStack(){
    const last = SLOT_DEF[SLOT_DEF.length - 1];
    stackEl.style.width = (last.left + last.width) + 'px';
    stackEl.style.height = SLOT_DEF[0].height + 'px';
  }

  function applySlot(card, slot){
    const def = SLOT_DEF[slot];
    card.style.width = def.width + 'px';
    card.style.height = def.height + 'px';
    card.style.left = def.left + 'px';
    card.style.top = Math.round((SLOT_DEF[0].height - def.height) / 2) + 'px';
    card.style.opacity = def.opacity;
    card.style.filter = 'brightness(' + def.brightness + ') saturate(' + (0.6 + def.opacity * 0.4) + ')';
    card.style.zIndex = def.z;
    card.dataset.slot = slot;
  }

  function makeCard(idx, slot, entering){
    const card = document.createElement('div');
    card.className = 'stack-card' + (entering ? ' entering' : '');
    card.setAttribute('role', 'option');
    card.dataset.idx = idx;
    const img = document.createElement('img');
    img.src = slideAt(idx).img;
    img.alt = slideAt(idx).location;
    img.loading = slot === 0 ? 'eager' : 'lazy';
    card.appendChild(img);
    card.addEventListener('click', () => {
      const clickedSlot = parseInt(card.dataset.slot, 10);
      if (clickedSlot === 0) return;
      rotate(clickedSlot);
      resetAutoplay();
    });
    applySlot(card, slot);
    stackEl.appendChild(card);
    return card;
  }

  function buildStack(){
    sizeStack();
    for (let s = 0; s < SLOT_DEF.length; s++){
      stackCards.push(makeCard(s, s, false));
    }
  }

  function rotate(steps){
    const newCurrent = currentIndex + steps;
    const survivors = [];
    const filledSlots = new Set();

    stackCards.forEach((card) => {
      const idx = parseInt(card.dataset.idx, 10);
      const newSlot = idx - newCurrent;
      if (newSlot >= 0 && newSlot < SLOT_DEF.length){
        applySlot(card, newSlot);
        filledSlots.add(newSlot);
        survivors.push(card);
      } else {
        card.classList.add('exiting');
        setTimeout(() => card.remove(), 650);
      }
    });

    for (let s = 0; s < SLOT_DEF.length; s++){
      if (!filledSlots.has(s)){
        const idx = newCurrent + s;
        const entering = makeCard(idx, Math.min(s + 1, SLOT_DEF.length - 1), true);
        survivors.push(entering);
        requestAnimationFrame(() => requestAnimationFrame(() => {
          entering.classList.remove('entering');
          applySlot(entering, s);
        }));
      }
    }

    stackCards = survivors;
    currentIndex = newCurrent;
    crossfadeBg(slideAt(currentIndex).img);
    switchText(slideAt(currentIndex));
  }

  function crossfadeBg(imgUrl){
    const incoming = bgs[1 - activeBg];
    const outgoing = bgs[activeBg];
    incoming.style.backgroundImage = 'url(' + imgUrl + ')';
    incoming.classList.remove('is-active');
    void incoming.offsetWidth; // restart animation
    incoming.classList.add('is-active');
    outgoing.classList.remove('is-active');
    activeBg = 1 - activeBg;
  }

  function setText(slide){
    locationEl.textContent = slide.location.toUpperCase();
    titleEl.textContent = slide.title;
    descEl.textContent = slide.desc;
    ctaLabelEl.textContent = slide.cta;
  }

  function switchText(slide){
    if (reduceMotion){ setText(slide); return; }
    heroText.classList.add('is-switching');
    setTimeout(() => {
      setText(slide);
      heroText.classList.remove('is-switching');
    }, 260);
  }

  function resetAutoplay(){
    clearTimeout(autoplayTimer);
    scheduleAutoplay();
  }
  function scheduleAutoplay(){
    autoplayTimer = setTimeout(() => {
      rotate(1);
      scheduleAutoplay();
    }, AUTOPLAY_MS);
  }

  const heroEl = document.querySelector('.hero');
  const canvasEl = document.getElementById('heroCanvas');
  const DESIGN_W = 1280;
  const DESIGN_H = 720;

  function fitCanvas(){
    const vw = heroEl.clientWidth;
    const vh = heroEl.clientHeight;
    const scale = Math.max(vw / DESIGN_W, vh / DESIGN_H);
    const scaledW = DESIGN_W * scale;
    const scaledH = DESIGN_H * scale;
    canvasEl.style.transform = 'scale(' + scale + ')';
    canvasEl.style.left = Math.round((vw - scaledW) / 2) + 'px';
    canvasEl.style.top = Math.round((vh - scaledH) / 2) + 'px';
  }

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fitCanvas, 80);
  });
  fitCanvas();

  buildStack();
  crossfadeBg(slides[0].img);
  setText(slides[0]);
  if (!reduceMotion) scheduleAutoplay();
})();
</script>

</body>
</html>
