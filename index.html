<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Northbound Expeditions</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>

:root{
  --ink:#14201E;
  --cream:#F1EAD9;
  --muted:rgba(241,234,217,.68);
  --gold:#C9973E;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
}

body{
  overflow:hidden;
  background:var(--ink);
  font-family:"Work Sans",sans-serif;
}


/* =================================
   HERO
================================= */

.hero{
  position:relative;

  width:100%;
  height:100vh;
  height:100dvh;

  min-height:560px;

  overflow:hidden;

  background:var(--ink);

  color:var(--cream);
}


/* =================================
   BACKGROUND
================================= */

.background{
  position:absolute;
  inset:-5%;

  background-size:cover;
  background-position:center bottom;
  background-repeat:no-repeat;

  opacity:0;

  transform:
    scale(1.1)
    translateY(-3%);

  transition:
    opacity 1s ease,
    transform 5s cubic-bezier(.22,.61,.36,1);

  z-index:1;
}

.background.active{
  opacity:1;

  transform:
    scale(1)
    translateY(2%);
}


/* =================================
   DARK OVERLAY
================================= */

.overlay{
  position:absolute;
  inset:0;

  z-index:2;

  background:
    linear-gradient(
      100deg,
      rgba(20,32,30,.96) 0%,
      rgba(20,32,30,.78) 30%,
      rgba(20,32,30,.35) 62%,
      rgba(20,32,30,.05) 90%
    );
}


/* =================================
   CONTENT
================================= */

.content{
  position:absolute;

  left:6%;
  top:50%;

  width:min(500px,43vw);

  transform:translateY(-50%);

  z-index:5;
}

.kicker{
  display:flex;
  align-items:center;
  gap:12px;

  margin-bottom:20px;

  color:var(--gold);

  font-size:10px;

  letter-spacing:.2em;

  text-transform:uppercase;
}

.kicker::before{
  content:"";

  width:32px;
  height:1px;

  background:var(--gold);
}

.title{
  margin:0 0 18px;

  font-family:"Fraunces",serif;

  font-style:italic;

  font-weight:500;

  font-size:
    clamp(
      2rem,
      4.5vw,
      4.4rem
    );

  line-height:1.04;

  letter-spacing:-.03em;

  transition:
    opacity .35s ease,
    transform .4s ease;
}

.description{
  margin:0 0 24px;

  max-width:500px;

  color:var(--muted);

  font-size:
    clamp(
      .8rem,
      1.3vw,
      1rem
    );

  line-height:1.7;

  transition:
    opacity .35s ease,
    transform .4s ease;
}

.place{
  display:flex;

  align-items:center;

  gap:8px;

  color:rgba(241,234,217,.5);

  font-size:10px;

  letter-spacing:.15em;

  text-transform:uppercase;
}

.place-dot{
  width:5px;
  height:5px;

  border-radius:50%;

  background:var(--gold);
}


/* =================================
   TEXT ANIMATION
================================= */

.content.hide .title,
.content.hide .description,
.content.hide .place{
  opacity:0;

  transform:translateY(12px);
}


/* =================================
   HORIZONTAL SLIDER WRAPPER
================================= */

.slider-wrap{
  position:absolute;

  left:6%;
  right:0;

  bottom:7%;

  z-index:6;

  overflow:hidden;

  /* NO BACKGROUND */

  background:transparent;
}


/* =================================
   SLIDER
================================= */

.slider{
  display:flex;

  align-items:flex-end;

  gap:16px;

  width:100%;

  overflow-x:auto;
  overflow-y:hidden;

  padding:20px 0 20px;

  scrollbar-width:none;

  scroll-behavior:smooth;

  cursor:grab;

  /* NO BACKGROUND */
  background:transparent;

  user-select:none;
}

.slider::-webkit-scrollbar{
  display:none;
}

.slider.dragging{
  cursor:grabbing;

  scroll-behavior:auto;
}


/* =================================
   CARD
================================= */

.card{
  position:relative;

  flex:0 0 150px;

  width:150px;
  height:190px;

  overflow:hidden;

  border-radius:24px;

  border:1px solid rgba(241,234,217,.15);

  opacity:.45;

  transform:scale(.86);

  transition:
    opacity .45s ease,
    transform .5s cubic-bezier(.22,.61,.36,1),
    border-color .45s ease,
    box-shadow .45s ease;

  cursor:pointer;
}

.card.active{
  opacity:1;

  transform:scale(1);

  border-color:
    rgba(201,151,62,.9);

  box-shadow:
    0 22px 55px rgba(0,0,0,.5);
}

.card:hover{
  opacity:.85;

  transform:scale(.93);
}

.card.active:hover{
  transform:scale(1.02);
}


/* =================================
   CARD IMAGE
================================= */

.card img{
  display:block;

  width:100%;
  height:100%;

  object-fit:cover;

  pointer-events:none;

  transition:
    transform .8s ease;
}

.card:hover img{
  transform:scale(1.06);
}


/* =================================
   CARD GRADIENT
================================= */

.card::after{
  content:"";

  position:absolute;
  inset:0;

  pointer-events:none;

  background:
    linear-gradient(
      to top,
      rgba(20,32,30,.72),
      transparent 60%
    );
}


/* =================================
   NUMBER
================================= */

.number{
  position:absolute;

  left:15px;
  bottom:13px;

  z-index:2;

  font-size:9px;

  letter-spacing:.2em;

  color:rgba(241,234,217,.65);
}

.card.active .number{
  color:var(--gold);
}


/* =================================
   PROGRESS
================================= */

.progress{
  position:absolute;

  left:6%;
  bottom:4%;

  z-index:7;

  width:120px;
  height:2px;

  overflow:hidden;

  background:
    rgba(241,234,217,.2);
}

.progress span{
  display:block;

  width:0;
  height:100%;

  background:var(--gold);
}


/* =================================
   MOBILE
================================= */

@media(max-width:700px){

  .overlay{
    background:
      linear-gradient(
        100deg,
        rgba(20,32,30,.96),
        rgba(20,32,30,.65)
      );
  }

  .content{
    left:6%;
    top:39%;

    width:43vw;
  }

  .title{
    font-size:1.6rem;
  }

  .description{
    font-size:.7rem;

    line-height:1.55;
  }

  .kicker{
    font-size:8px;

    margin-bottom:14px;
  }

  .slider-wrap{
    left:5%;
    right:0;

    bottom:5%;
  }

  .slider{
    gap:12px;

    padding-right:20px;
  }

  .card{
    flex-basis:105px;

    width:105px;
    height:150px;

    border-radius:19px;
  }

  .progress{
    display:none;
  }
}


/* =================================
   REDUCED MOTION
================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    transition:none!important;
    scroll-behavior:auto!important;
  }

}

</style>
</head>


<body>

<section class="hero">


  <!-- BACKGROUNDS -->

  <div
    class="background active"
    id="backgroundA">
  </div>

  <div
    class="background"
    id="backgroundB">
  </div>


  <!-- OVERLAY -->

  <div class="overlay"></div>


  <!-- CONTENT -->

  <div
    class="content"
    id="content">

    <div class="kicker">
      Northbound Expeditions
    </div>

    <h1
      class="title"
      id="title">
      Where the ice remembers
    </h1>

    <p
      class="description"
      id="description">
      Svalbard, Norway — polar bear country at eighty degrees north, where the summer sun never sets.
    </p>

    <div class="place">

      <span class="place-dot"></span>

      <span id="place">
        Svalbard, Norway
      </span>

    </div>

  </div>


  <!-- HORIZONTAL IMAGE SLIDER -->

  <div class="slider-wrap">

    <div
      class="slider"
      id="slider">
    </div>

  </div>


  <!-- PROGRESS -->

  <div class="progress">

    <span id="progress"></span>

  </div>


</section>


<script>

/* =========================================
   DATA
========================================= */

const slides = [

  {
    image:
    "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=1600&q=85",

    title:
    "Where the ice remembers",

    description:
    "Svalbard, Norway — polar bear country at eighty degrees north, where the summer sun never sets.",

    place:
    "Svalbard, Norway"
  },

  {
    image:
    "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1600&q=85",

    title:
    "Cliffs that outlast the wind",

    description:
    "The Faroe Islands — turf-roofed villages tucked beneath sea cliffs older than memory.",

    place:
    "Faroe Islands"
  },

  {
    image:
    "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1600&q=85",

    title:
    "Granite against the sky",

    description:
    "Torres del Paine, Patagonia — glacial towers standing over turquoise water.",

    place:
    "Patagonia, Chile"
  },

  {
    image:
    "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1600&q=85",

    title:
    "A quiet the size of a valley",

    description:
    "Fiordland, New Zealand — rainforest and mist folded into ancient fjords.",

    place:
    "Fiordland, New Zealand"
  },

  {
    image:
    "https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1600&q=85",

    title:
    "Fire under permanent frost",

    description:
    "Kamchatka, Russia — volcanoes and hot springs at the edge of the Pacific.",

    place:
    "Kamchatka, Russia"
  },

  {
    image:
    "https://images.unsplash.com/photo-1454496522488-7a8e488e8606?auto=format&fit=crop&w=1600&q=85",

    title:
    "A desert carved from cold",

    description:
    "Ladakh, India — high mountain passes and monasteries above the clouds.",

    place:
    "Ladakh, India"
  }

];


/* =========================================
   ELEMENTS
========================================= */

const slider =
  document.getElementById("slider");

const title =
  document.getElementById("title");

const description =
  document.getElementById("description");

const place =
  document.getElementById("place");

const content =
  document.getElementById("content");

const progress =
  document.getElementById("progress");

const backgrounds = [

  document.getElementById("backgroundA"),

  document.getElementById("backgroundB")

];


/* =========================================
   STATE
========================================= */

let current = 0;

let activeBackground = 0;

let autoplay = null;

let progressFrame = null;

const AUTO_TIME = 5000;


/* =========================================
   BUILD CARDS
========================================= */

function buildCards(){

  slides.forEach((slide,index)=>{

    const card =
      document.createElement("div");

    card.className = "card";

    card.dataset.index = index;

    if(index === 0){

      card.classList.add("active");

    }


    card.innerHTML = `

      <img
        src="${slide.image}"
        alt="${slide.title}"
        draggable="false"
      >

      <span class="number">
        ${String(index+1).padStart(2,"0")}
      </span>

    `;


    card.addEventListener(
      "click",
      function(){

        activate(index);

      }
    );


    slider.appendChild(card);

  });

}


/* =========================================
   MOVE CARD TO LEFT
========================================= */

function moveCardToLeft(index){

  const card =
    slider.querySelector(
      `.card[data-index="${index}"]`
    );

  if(!card){
    return;
  }


  /*
    This is the important part.

    Selected card becomes the
    LEFTMOST card.
  */

  slider.scrollTo({

    left:
      card.offsetLeft -
      slider.offsetLeft,

    behavior:"smooth"

  });

}


/* =========================================
   UPDATE ACTIVE CARD
========================================= */

function updateCards(index){

  const cards =
    slider.querySelectorAll(".card");


  cards.forEach(card=>{

    card.classList.toggle(
      "active",
      Number(card.dataset.index) === index
    );

  });

}


/* =========================================
   BACKGROUND
========================================= */

function updateBackground(index){

  const next =
    backgrounds[
      1-activeBackground
    ];

  const old =
    backgrounds[
      activeBackground
    ];


  next.style.backgroundImage =
    `url("${slides[index].image}")`;


  next.classList.remove("active");

  next.style.opacity = "0";

  next.style.transform =
    "scale(1.1) translateY(-3%)";


  next.offsetHeight;


  requestAnimationFrame(()=>{

    next.classList.add("active");

    next.style.opacity = "1";

    next.style.transform =
      "scale(1) translateY(2%)";

  });


  old.classList.remove("active");

  old.style.opacity = "0";


  activeBackground =
    1-activeBackground;

}


/* =========================================
   TEXT
========================================= */

function updateText(index){

  content.classList.add("hide");


  setTimeout(()=>{

    title.textContent =
      slides[index].title;

    description.textContent =
      slides[index].description;

    place.textContent =
      slides[index].place;


    content.classList.remove("hide");

  },280);

}


/* =========================================
   ACTIVATE SLIDE
========================================= */

function activate(index){

  if(index === current){

    moveCardToLeft(index);

    return;

  }


  current = index;


  updateCards(index);

  moveCardToLeft(index);

  updateBackground(index);

  updateText(index);

  resetAutoplay();

}


/* =========================================
   NEXT
========================================= */

function next(){

  let nextIndex =
    current + 1;


  if(nextIndex >= slides.length){

    nextIndex = 0;

  }


  activate(nextIndex);

}


/* =========================================
   PREVIOUS
========================================= */

function previous(){

  let previousIndex =
    current - 1;


  if(previousIndex < 0){

    previousIndex =
      slides.length - 1;

  }


  activate(previousIndex);

}


/* =========================================
   AUTOPLAY
========================================= */

function startAutoplay(){

  clearInterval(autoplay);

  autoplay =
    setInterval(
      next,
      AUTO_TIME
    );


  startProgress();

}


/* =========================================
   RESET
========================================= */

function resetAutoplay(){

  clearInterval(autoplay);

  cancelAnimationFrame(
    progressFrame
  );

  progress.style.width =
    "0%";

  startAutoplay();

}


/* =========================================
   PROGRESS
========================================= */

function startProgress(){

  const start =
    performance.now();


  function animate(now){

    const elapsed =
      now-start;


    const percent =
      Math.min(
        elapsed/AUTO_TIME*100,
        100
      );


    progress.style.width =
      percent+"%";


    if(percent < 100){

      progressFrame =
        requestAnimationFrame(
          animate
        );

    }

  }


  progressFrame =
    requestAnimationFrame(
      animate
    );

}


/* =========================================
   MOUSE WHEEL
========================================= */

slider.addEventListener(
  "wheel",
  function(event){

    event.preventDefault();


    if(event.deltaY > 0){

      next();

    }
    else{

      previous();

    }

  },
  {
    passive:false
  }
);


/* =========================================
   DRAG
========================================= */

let isDragging = false;

let dragStartX = 0;

let dragScroll = 0;


slider.addEventListener(
  "pointerdown",
  function(event){

    isDragging = true;

    dragStartX =
      event.clientX;

    dragScroll =
      slider.scrollLeft;

    slider.classList.add(
      "dragging"
    );

    slider.setPointerCapture(
      event.pointerId
    );

  }
);


slider.addEventListener(
  "pointermove",
  function(event){

    if(!isDragging){
      return;
    }


    const distance =
      event.clientX -
      dragStartX;


    slider.scrollLeft =
      dragScroll-distance;

  }
);


slider.addEventListener(
  "pointerup",
  function(){

    if(!isDragging){
      return;
    }


    isDragging = false;

    slider.classList.remove(
      "dragging"
    );


    /*
      After dragging,
      find the card closest
      to the LEFT edge.
    */

    const cards =
      [...slider.querySelectorAll(
        ".card"
      )];


    let nearest = 0;

    let distance =
      Infinity;


    cards.forEach((card,index)=>{

      const d =
        Math.abs(
          card.offsetLeft -
          slider.scrollLeft
        );


      if(d < distance){

        distance = d;

        nearest = index;

      }

    });


    activate(nearest);

  }
);


/* =========================================
   TOUCH
========================================= */

let touchStartX = 0;


slider.addEventListener(
  "touchstart",
  function(event){

    touchStartX =
      event.touches[0].clientX;

  },
  {
    passive:true
  }
);


slider.addEventListener(
  "touchend",
  function(event){

    const touchEndX =
      event.changedTouches[0].clientX;


    const distance =
      touchStartX-touchEndX;


    if(Math.abs(distance)<40){

      return;

    }


    if(distance>0){

      next();

    }
    else{

      previous();

    }

  },
  {
    passive:true
  }
);


/* =========================================
   KEYBOARD
========================================= */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "ArrowRight"){

      next();

    }


    if(event.key === "ArrowLeft"){

      previous();

    }

  }
);


/* =========================================
   INIT
========================================= */

function init(){

  backgrounds[0].style.backgroundImage =
    `url("${slides[0].image}")`;

  backgrounds[0].style.opacity =
    "1";

  backgrounds[0].style.transform =
    "scale(1) translateY(2%)";


  buildCards();

  updateCards(0);

  startAutoplay();

}


init();

</script>

</body>
</html>
